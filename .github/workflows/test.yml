name: Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Metrics rendering tests
        run: python3 test-metrics-render.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: nzbgetvpn:test
          load: true
          cache-from: type=gha,scope=linux-amd64
          provenance: false

      # These need the image's GNU stat, timeout and jq
      - name: Auto-restart watchdog tests
        run: docker run --rm --entrypoint bash -v "$PWD:/src:ro" nzbgetvpn:test /src/test-auto-restart.sh

      - name: Cached healthcheck tests
        run: docker run --rm --entrypoint bash -v "$PWD:/src:ro" nzbgetvpn:test /src/test-healthcheck-cached.sh
